name: Vercel Deploy

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "Missing VERCEL_DEPLOY_HOOK_URL secret"
            exit 1
          fi

          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            --data '{"trigger":"github-actions","ref":"${{ github.ref_name }}","sha":"${{ github.sha }}"}'
